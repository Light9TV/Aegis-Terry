<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Terry / Aegis counterpicks</title>
<style>
:root{--bg:#fff;--fg:#1b1b1b;--mut:#666;--line:#e6e6e6;--t:#a8461a;--tb:#fbe9df;--a:#0d6b60;--ab:#dcf2ee;--d:#555;--db:#efefef}
@media (prefers-color-scheme:dark){:root{--bg:#121212;--fg:#ececec;--mut:#9b9b9b;--line:#2b2b2b;--t:#f2a273;--tb:#3b2317;--a:#72d8c6;--ab:#133b35;--d:#c4c4c4;--db:#262626}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:20px;font-weight:600;margin:0 0 4px}
.sub{color:var(--mut);font-size:13px;margin:0 0 14px}
input{width:100%;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
.chip{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:none;color:var(--fg);cursor:pointer}
.chip.on{background:var(--db);border-color:var(--mut)}
.row{padding:10px 0;border-bottom:1px solid var(--line)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.n{font-weight:600}
.b{font-size:12px;padding:2px 8px;border-radius:6px;white-space:nowrap}
.T{background:var(--tb);color:var(--t)}.A{background:var(--ab);color:var(--a)}.D{background:var(--db);color:var(--d)}
.r{font-size:13px;color:var(--mut);margin:4px 0 0}
.tt{color:var(--t);font-weight:600}.aa{color:var(--a);font-weight:600}
.foot{font-size:12px;color:var(--mut);margin-top:20px}
</style>
</head>
<body>
<main>
<h1>Terry / Aegis counterpicks</h1>
<p class="sub">Terry 10M GSP, Aegis 8M. Terry main with Aegis as a real secondary.</p>
<input id="q" placeholder="Search a fighter" aria-label="Search a fighter">
<div class="chips" id="chips"></div>
<div id="list"></div>
<p class="foot">-1 / even / +1 ratings from Game8's Terry matchup chart. Picks are opinions; adjust to your own results.</p>
</main>
<script>
const X=[
["Bayonetta","T","Terry's +1. Invincible Rising Tackle breaks her pressure; Mythra's fast fall makes her ladder food."],
["Bowser","T","Even. Big target for nair combos; respect Flying Slam."],
["Captain Falcon","T","Even. OoS Rising Tackle punishes his approaches."],
["Chrom","T","Even. Spike his linear Soaring Slash."],
["Corrin","T","Even. Punish laggy pin and smashes."],
["Donkey Kong","T","Even. Big body eats your combos. Respect cargo throw near ledge."],
["Dr. Mario","T","Even. He's slow; whiff-punish him."],
["Ganondorf","T","Even. Outpace him and punish whiffs."],
["Ike","T","Even. Punish laggy swings; edgeguard Aether."],
["Incineroar","T","Terry's +1. Ledge-trap his bad recovery; his grabs punish Mythra's slow dodges."],
["Isabelle","T","Terry's +1. She struggles to kill you."],
["King K. Rool","T","Terry's +1. Big target; ledge-trap his recovery."],
["Little Mac","T","Terry's +1. Free edgeguards; auto-turn stops crossups."],
["Lucario","T","Even. Kill before aura scales."],
["Lucas","T","Even. Weight resists his throws; edgeguard PK Thunder."],
["Luigi","T","Even. Stay out of grab range and punish whiffed grabs."],
["Mario","T","Even. Your weight outlasts his combos; ledge-trap his recovery."],
["Mewtwo","T","Terry's +1. Huge hurtbox eats your combos."],
["Mii Brawler","T","Even. Edgeguard his recovery."],
["Mii Swordfighter","T","Terry's +1."],
["Ness","T","Even. Your weight resists back throw; edgeguard PK Thunder."],
["Olimar","T","Terry's +1. Big swings clear pikmin."],
["Pit / Dark Pit","T","Terry's +1. Shield arrows and push in."],
["Ridley","T","Even. Huge hurtbox; ledge-trap his recovery."],
["Roy","T","Even. Rising Tackle OoS beats his shield pressure."],
["Ryu","T","Even. Invincible specials trade evenly and you're heavier."],
["Sora","T","Not on Game8's chart. He struggles to kill heavy Terry."],
["Terry","T","Ditto. Play your main."],
["Yoshi","T","Even. Anti-air his aerials; don't chase his double jump offstage."],
["Banjo & Kazooie","D","he's aggressive with Wonderwing","he camps eggs (recover high with Mythra)"],
["Bowser Jr.","D","he pressures up close with Clown Car","he camps Mechakoopas"],
["Byleth","D","he plays close","he zones with lances and arrows"],
["Cloud","D","he's up close and aggressive","he camps to charge Limit (Mythra punishes it)"],
["Falco","D","he rushes in with combos","he camps lasers"],
["Fox","D","he rushes in (auto-turn and OoS Rising Tackle punish him)","he runs and lasers"],
["Hero","D","he rushes in with the sword","he zones with spells"],
["Ice Climbers","D","they hunt grabs (Mythra's slow dodges are grab bait)","they space and stay together (Pyra separates Nana)"],
["King Dedede","D","he plays close and grab-heavy","he Gordo camps"],
["Piranha Plant","D","it plays close","it camps Ptooie"],
["R.O.B.","D","he plays close and grab-heavy","he camps gyro and laser"],
["Sephiroth","D","he plays close","Shadow Flare and his range wall you out"],
["Wario","D","he's aggressive in the air (anti-air him)","he plays patient around waft"],
["Wolf","D","he rushes with nair and bair","he camps blaster"],
["Kazuya","D","you're winning neutral (his recovery is weak)","his combos keep landing on Terry's big body"],
["Pyra / Mythra","D","they lean on Pyra (punish laggy swings with invincible OoS)","they lean on Mythra and her speed runs you over"],
["Sheik","D","she's struggling to close stocks on heavy Terry","she's outpacing you in neutral"],
["Sonic","D","he camps for time (he struggles to kill heavy Terry)","he out-scrambles you up close (Mythra's frame-2 jab)"],
["Diddy Kong","A","Terry's -1. Pyra kills light Diddy early."],
["Duck Hunt","A","Terry's -1. Mythra breaks can and disc zoning."],
["Greninja","A","Mythra keeps pace. Pyra kills before he escapes."],
["Inkling","A","Terry's -1. Mythra's speed and Pyra's range win."],
["Jigglypuff","A","Terry's slow air speed can't chase her. Mythra can, and Pyra kills her early."],
["Joker","A","Terry's -1. Pyra kills before Arsene shows up."],
["Ken","A","Terry's -1. Pyra's range keeps Ken out."],
["Kirby","A","Light and floaty. Pyra outranges him and kills early."],
["Link","A","Even on paper, but bombs and arrows wall Terry. Mythra breaks the zoning."],
["Lucina","A","Terry's -1. Pyra matches her range."],
["Marth","A","Terry's -1 (tipper outranges you). Pyra matches range."],
["Mega Man","A","Terry's -1. Mythra beats pellet camping."],
["Meta Knight","A","Terry's air speed can't chase him. Pyra kills light MK early."],
["Mii Gunner","A","Even on paper, but a zoner. Mythra closes in."],
["Min Min","A","Terry's -1. Mythra is the zone-breaker."],
["Mr. Game & Watch","A","Terry's -1. Pyra kills light G&W early. Bucket eats Mythra's up-B."],
["Pac-Man","A","Terry's -1. Mythra rushes through hydrant and fruit."],
["Palutena","A","Terry's -1. Mythra breaks her zoning."],
["Peach / Daisy","A","Pyra's disjoint beats float aerials. Mythra punishes turnip pulls."],
["Pichu","A","Ultra-light. One Pyra read takes the stock."],
["Pikachu","A","Terry's -1. Gimps your recovery; Pyra kills Pika early."],
["Pokémon Trainer","A","Terry's -1. Mythra's speed handles all three."],
["Robin","A","Terry's -1. Mythra punishes slow tomes."],
["Rosalina & Luma","A","Pyra's disjoints bully Luma. Mythra punishes Rosa."],
["Samus / Dark Samus","A","Terry's -1. Charge shot and missiles wall you; Mythra runs through them."],
["Shulk","A","Terry's -1. Outranged; Pyra matches his range."],
["Simon / Richter","A","Even on paper, but holy water and axes wall Terry. Mythra runs through."],
["Snake","A","Terry's -1. Explosives wall you out; recover high with Mythra."],
["Steve","A","Game8 calls it even, but blocks and minecart punish Terry's slow air speed. Pyra's sword breaks blocks."],
["Toon Link","A","Even on paper, but projectiles wall Terry. Mythra closes the gap."],
["Villager","A","Even on paper, but Lloid and slingshot wall Terry. Pocket steals Mythra's up-B shots."],
["Wii Fit Trainer","A","Terry's -1. Mythra beats ball and Sun Salutation camping."],
["Young Link","A","Even on paper, but projectiles wall Terry. Mythra closes the gap."],
["Zelda","A","Mythra runs through Din's Fire and Phantom."],
["Zero Suit Samus","A","Light; Pyra kills early. Watch flip-kick spikes on Mythra's recovery."]
];
X.sort((a,b)=>a[0].localeCompare(b[0]));
const L={T:"Terry",A:"Aegis",D:"Depends"};
const norm=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
let f="all";
const q=document.getElementById("q"),list=document.getElementById("list"),chips=document.getElementById("chips");
const n=k=>X.filter(x=>x[1]===k).length;
[["all","All "+X.length],["T","Terry "+n("T")],["D","Depends "+n("D")],["A","Aegis "+n("A")]].forEach(([k,t])=>{
const b=document.createElement("button");b.className="chip"+(k===f?" on":"");b.textContent=t;
b.onclick=()=>{f=k;[...chips.children].forEach(c=>c.classList.toggle("on",c===b));draw();};
chips.appendChild(b);});
function body(x){
if(x[1]!=="D")return '<p class="r">'+x[2]+'</p>';
return '<p class="r"><span class="tt">Terry</span> if '+x[2]+'.</p><p class="r"><span class="aa">Aegis</span> if '+x[3]+'.</p>';
}
function draw(){
const s=norm(q.value.trim());
const r=X.filter(x=>(f==="all"||x[1]===f)&&norm(x[0]).includes(s));
list.innerHTML=r.length?r.map(x=>'<div class="row"><div class="top"><span class="n">'+x[0]+'</span><span class="b '+x[1]+'">'+L[x[1]]+'</span></div>'+body(x)+'</div>').join(""):'<p class="r">No fighter matches that search.</p>';
}
q.oninput=draw;draw();
</script>
</body>
</html>
